<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第九轮 · 信号材质对比</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9edf0;font-family:"Microsoft YaHei",sans-serif;color:#20313f}header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center}button{padding:10px 16px;border:1px solid #c6d0d7;background:#fafbf9;border-radius:20px;cursor:pointer}#board{display:block;width:100%;max-width:1440px;height:auto;margin:auto}#source{position:absolute;left:-2000px;top:0;width:1440px;height:403px;pointer-events:none}p{margin:0;font-size:14px}</style></head>
<body><header><p>第九轮 / 只比较信号材质，不比较 Header 或标题位置</p><button id="download" disabled>保存 1440 × 900 对比图</button></header>
<canvas id="board" width="1440" height="900" role="img" aria-label="参考图与当前 Canvas 信号材质对比，附中央和谱峰局部放大"></canvas><canvas id="source" aria-hidden="true"></canvas>
<script src="../physics.js"></script><script src="../home-signal.js?v=material3"></script><script>
const board=document.querySelector('#board'),source=document.querySelector('#source'),ctx=board.getContext('2d');
const stop=FTIRHomeSignal.mount(source,FTIRPhysics),ref=new Image();
ref.onload=()=>{
  const d=source.width/1440;
  ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,1440,900);ctx.fillStyle='#19303f';ctx.font='24px Microsoft YaHei';ctx.fillText('FTIR SIGNAL MATERIAL / 第九轮',32,44);
  ctx.font='15px Microsoft YaHei';ctx.fillStyle='#657785';ctx.fillText('REFERENCE · 参考图信号区域',32,82);
  ctx.drawImage(ref,0,470,ref.naturalWidth,260,0,110,1440,208);
  ctx.fillText('CURRENT · Canvas 2D / 220 条微纤维 + 包络材质 + 能量纹理',32,398);
  ctx.drawImage(source,0,45*d,1440*d,330*d,0,414,1440,272);
  ctx.fillText('局部 / 中心突峰微结构',32,720);ctx.fillText('局部 / 谱峰材质',752,720);
  ctx.drawImage(source,595*d,110*d,260*d,200*d,32,735,650,130);
  ctx.drawImage(source,1130*d,90*d,290*d,200*d,752,735,650,130);
  ctx.font='12px Microsoft YaHei';ctx.fillText('合成数据骨架；纤维与蓝金颜色仅为 Hero 表现层。参考图与当前视觉按各自范围裁切，非定量比较。',32,891);
  document.querySelector('#download').disabled=false;stop();
};ref.src='signal-reference.png';
document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.download='FTIR-R9-material-comparison-1440x900.png';a.href=board.toDataURL('image/png');a.click();};
</script></body></html>

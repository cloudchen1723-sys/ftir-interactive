<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTIR 主视觉 · 并排复核</title><style>

</style></head><body><header>FTIR Signal Sculpture / 同屏视觉复核</header><main><section><h2>参考图 · 只参考信号形态与材质</h2><div class="surface"><img class="reference" src="signal-reference.png" alt="用户提供的浅色 FTIR 信号视觉参考"></div></section><section><h2>当前页面 · 1440px 布局等比缩小</h2><div class="surface" id="preview"><iframe class="live" src="../" title="当前 FTIR 首页"></iframe></div></section></main><footer>检查：全宽连续／没有流程箭头／蓝金层次／中心突峰／谱峰接入同一基线。<br>当前 Header、标题、按钮保留确认版；不是对参考图整页进行复刻。两侧按各自原始比例完整显示。</footer><script>const el=document.querySelector('#preview');new ResizeObserver(()=>el.style.setProperty('--scale',el.clientWidth/1440)).observe(el);</script></body></html>
